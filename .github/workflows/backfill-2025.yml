name: ⚡ 2025 Races Historical Backfill & Parity

on:
  # Allow manual trigger with flexible targeting
  workflow_dispatch:
    inputs:
      target:
        description: 'Target dataset to backfill'
        required: true
        default: 'missing_33'
        type: choice
        options:
          - 'missing_33'       # Ingest the 33 races skipped from sonstige
          - 'category_a'       # Ingest incomplete multi-wave events (World Champs Chicago, Singapore Expo)
          - 'specific_race'    # Ingest a specific race (fill race_id below)
          - 'all_2025'         # Run full 2025 backfill
      race_id:
        description: 'Specific race slug (only if specific_race selected, e.g. world-championships-2025, manchester-2025)'
        required: false
        default: ''
        type: string

jobs:
  backfill:
    name: Backfill (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max cloud execution time

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🚀 Run Backfill Ingestor
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          FLAGS="--target ${{ github.event.inputs.target }}"
          if [ -n "${{ github.event.inputs.race_id }}" ]; then
            FLAGS="$FLAGS --race ${{ github.event.inputs.race_id }}"
          fi
          echo "Executing: node scripts/scrape_2025_backfill.mjs $FLAGS"
          node scripts/scrape_2025_backfill.mjs $FLAGS
