name: ⚡ Live Weekend Sync

on:
  # Triggered hourly via Upstash QStash (Zero delay) or manually via GitHub UI
  workflow_dispatch:
    inputs:
      race:
        description: 'Target specific race (e.g. athens, acapulco, all, or leave blank for active live races)'
        required: false
        default: ''
        type: string
      splits:
        description: 'Deep splits limit per division (default: all for 100% full chip split accuracy, or specific number)'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Dry run (no DB writes)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# 🛡️ Concurrency Lock: Prevents overlapping runs if one is already in progress
concurrency:
  group: live-weekend-sync
  cancel-in-progress: false

jobs:
  live-sync:
    name: ⚡ Scrape Live Weekend Heats
    runs-on: ubuntu-latest
    # A race day is one long session (a pass every 10 minutes) instead of one cold start per hour.
    # Upstash triggers that arrive meanwhile wait in the concurrency queue and take over when it ends.
    timeout-minutes: 350

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "🔍 Gatekeeper: Check if any race is active today"
        id: gatekeeper
        env:
          FORCE_RACE: ${{ github.event.inputs.race }}
          IS_MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: node check_active_today.mjs

      - name: 📥 Install dependencies
        if: steps.gatekeeper.outputs.active == 'true'
        run: npm install

      - name: 🌐 Install Playwright Chromium browser
        if: steps.gatekeeper.outputs.active == 'true'
        run: npx playwright install chromium --with-deps

      - name: ⚡ Run Live Sync Engine (race-day session)
        if: steps.gatekeeper.outputs.active == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          IN_RACE: ${{ github.event.inputs.race }}
          IN_SPLITS: ${{ github.event.inputs.splits || 'all' }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # One pass every 10 minutes for up to ~5.5 hours while a race is active. Each pass reads the
          # list pages and opens detail pages only for new finishers (sync_live.mjs skips athletes that
          # already have splits); a pass stops opening detail pages at its --until budget.
          SESSION_END=$(( $(date +%s) + 330 * 60 ))
          PASS=1
          while :; do
            START=$(date +%s)
            UNTIL=$(( START + 50 * 60 ))
            [ "$UNTIL" -gt "$SESSION_END" ] && UNTIL=$SESSION_END
            ARGS=(--splits="$IN_SPLITS" --until "$UNTIL")
            [ -n "$IN_RACE" ] && ARGS+=(--race="$IN_RACE")
            [ "$IN_DRY_RUN" = "true" ] && ARGS+=(--test)
            echo "::group::Pass $PASS ($(date -u +%H:%M) UTC)"
            node sync_live.mjs "${ARGS[@]}" || echo "⚠️ Pass $PASS failed; the next pass retries."
            echo "::endgroup::"

            # Manual single-race or dry runs do one pass.
            if [ -n "$IN_RACE" ] || [ "$IN_DRY_RUN" = "true" ]; then break; fi
            NEXT=$(( START + 10 * 60 ))
            if [ "$NEXT" -ge "$SESSION_END" ]; then echo "Session time budget reached."; break; fi
            # Stop as soon as no race is active any more (end of the race weekend).
            GATE=$(mktemp)
            GITHUB_OUTPUT="$GATE" node check_active_today.mjs > /dev/null 2>&1 || true
            if ! grep -q 'active=true' "$GATE"; then echo "No race active any more — ending the session."; break; fi
            NOW=$(date +%s)
            if [ "$NOW" -lt "$NEXT" ]; then sleep $(( NEXT - NOW )); fi
            PASS=$(( PASS + 1 ))
          done
