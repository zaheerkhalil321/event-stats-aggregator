name: ⚡ Live Weekend Sync

on:
  schedule:
    # Run every 4 hours (06:15, 10:15, 14:15, 18:15, 22:15 UTC) every day (Race Days + Tuesday + Wrap-Up)
    - cron: '15 6,10,14,18,22 * * *'

  # Allow manual trigger with optional race target, splits depth, or dry-run
  workflow_dispatch:
    inputs:
      race:
        description: 'Target specific race (e.g. athens, acapulco, all, or leave blank for active live races)'
        required: false
        default: 'all'
        type: string
      splits:
        description: 'Deep splits limit per division (default: 20 for fast sync, 0 for counter only, 50, all)'
        required: false
        default: '20'
        type: string
      dry_run:
        description: 'Dry run (no DB writes)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# 🛡️ Concurrency Lock: Prevents overlapping runs if one is already in progress
concurrency:
  group: live-weekend-sync
  cancel-in-progress: false

jobs:
  live-sync:
    name: ⚡ Scrape Live Weekend Heats
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "🔍 Gatekeeper: Check if any race is active today"
        id: gatekeeper
        env:
          FORCE_RACE: ${{ github.event.inputs.race }}
          IS_MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: node check_active_today.mjs

      - name: 📥 Install dependencies
        if: steps.gatekeeper.outputs.active == 'true'
        run: npm install

      - name: 🌐 Install Playwright Chromium browser
        if: steps.gatekeeper.outputs.active == 'true'
        run: npx playwright install chromium --with-deps

      - name: ⚡ Run Live Sync Engine
        if: steps.gatekeeper.outputs.active == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.race }}" ]; then
            FLAGS="$FLAGS --race=${{ github.event.inputs.race }}"
          fi
          if [ -n "${{ github.event.inputs.splits }}" ]; then
            FLAGS="$FLAGS --splits=${{ github.event.inputs.splits }}"
          else
            FLAGS="$FLAGS --splits=20"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --test"
          fi
          node sync_live.mjs $FLAGS
